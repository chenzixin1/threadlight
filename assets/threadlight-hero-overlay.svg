<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941">
  <defs>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <g transform="translate(82 126)">
    <path d="M0 39 C26 39 30 9 57 22 C78 33 86 0 113 0"
          fill="none" stroke="#83AFFF" stroke-width="5" stroke-linecap="round"/>
    <circle cx="0" cy="39" r="8" fill="#304FFE"/>
    <circle cx="57" cy="22" r="8" fill="#22C96B"/>
    <circle cx="113" cy="0" r="8" fill="#F5A312"/>
  </g>

  <text x="82" y="242" fill="#FFFFFF"
        font-family="SF Pro Display, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="82" font-weight="650" letter-spacing="-2">Threadlight</text>
  <text x="86" y="302" fill="#8FA4C6"
        font-family="SF Pro Text, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="19" font-weight="600" letter-spacing="3.2">CODEX TASK STATUS · WHOLE-BOARD RGB</text>

  <text x="82" y="414" fill="#F7F9FF"
        font-family="PingFang SC, SF Pro Display, -apple-system, sans-serif"
        font-size="50" font-weight="650" letter-spacing="-1">让任务状态，</text>
  <text x="82" y="482" fill="#F7F9FF"
        font-family="PingFang SC, SF Pro Display, -apple-system, sans-serif"
        font-size="50" font-weight="650" letter-spacing="-1">亮在键盘上。</text>

  <text x="85" y="548" fill="#AAB7CD"
        font-family="PingFang SC, SF Pro Text, -apple-system, sans-serif"
        font-size="21" font-weight="400">运行、完成或等待时，整块键盘立即回应。</text>

  <g transform="translate(84 624)" font-family="PingFang SC, SF Pro Text, -apple-system, sans-serif"
     font-size="18" font-weight="500" fill="#CBD4E5">
    <circle cx="10" cy="10" r="18" fill="#304FFE" opacity="0.24" filter="url(#softGlow)"/>
    <circle cx="10" cy="10" r="8" fill="#4B6BFF"/>
    <text x="34" y="16">执行中</text>

    <circle cx="132" cy="10" r="18" fill="#00E676" opacity="0.22" filter="url(#softGlow)"/>
    <circle cx="132" cy="10" r="8" fill="#22C96B"/>
    <text x="156" y="16">已完成</text>

    <circle cx="268" cy="10" r="18" fill="#FF8A00" opacity="0.22" filter="url(#softGlow)"/>
    <circle cx="268" cy="10" r="8" fill="#F5A312"/>
    <text x="292" y="16">等待</text>

    <circle cx="374" cy="10" r="18" fill="#FF334D" opacity="0.22" filter="url(#softGlow)"/>
    <circle cx="374" cy="10" r="8" fill="#F04444"/>
    <text x="398" y="16">失败</text>
  </g>
